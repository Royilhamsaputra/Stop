<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel standalone for JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF & AutoTable for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .pulse-online {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global environment variables or standard fallbacks
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'stock-opname-app-v1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDummyKeyForFallbackPurposeOnly",
                authDomain: "stock-opname-app.firebaseapp.com",
                projectId: "stock-opname-app",
                storageBucket: "stock-opname-app.appspot.com",
                messagingSenderId: "1234567890",
                appId: "1:1234567890:web:abcdef123456"
            };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase initialization warning: ", e);
        }

        window.firebaseInstance = {
            app, auth, db, appId, initialAuthToken,
            signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            doc, setDoc, getDoc, updateDoc, deleteDoc, collection, onSnapshot
        };

        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Safe Lucide Icon component wrapper to prevent React DOM mutation crashes
        const Icon = ({ name, className = "w-4 h-4", ...props }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        try {
                            window.lucide.createIcons({ root: containerRef.current });
                        } catch (e) {
                            window.lucide.createIcons();
                        }
                    }
                }
            }, [name, className]);

            return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" {...props} />;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("App Error caught by boundary:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                            <div className="bg-white p-6 rounded-xl shadow-lg max-w-md w-full text-center">
                                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <Icon name="alert-triangle" className="w-6 h-6" />
                                </div>
                                <h2 className="text-lg font-bold text-slate-800 mb-2">Aplikasi Mengalami Kendala</h2>
                                <p className="text-xs text-slate-500 mb-4">{this.state.error?.toString()}</p>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold"
                                >
                                    Muat Ulang Halaman
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Default initial data for items demo
        const INITIAL_ITEMS = [
            { id: 'item-1', code: 'BRG-001', name: 'Beras Premium 5kg', unit: 'Sak', stockAwal: 0, barangMasuk: 0, transferIn: 0, transferOut: 0, spoilWaste: 0, stockAkhir: 0, notes: 'Aman' },
            { id: 'item-2', code: 'BRG-002', name: 'Minyak Goreng 2L', unit: 'Pouch', stockAwal: 0, barangMasuk: 0, transferIn: 0, transferOut: 0, spoilWaste: 0, stockAkhir: 0, notes: 'Stok cukup' },
            { id: 'item-3', code: 'BRG-003', name: 'Gula Pasir 1kg', unit: 'Kg', stockAwal: 0, barangMasuk: 0, transferIn: 0, transferOut: 0, spoilWaste: 0, stockAkhir: 0, notes: 'Kemasan rusak 2' },
            { id: 'item-4', code: 'BRG-004', name: 'Daging Ayam Broiler', unit: 'Kg', stockAwal: 0, barangMasuk: 0, transferIn: 0, transferOut: 0, spoilWaste: 0, stockAkhir: 0, notes: '3kg expired/spoil' },
            { id: 'item-5', code: 'BRG-005', name: 'Telur Ayam Broiler', unit: 'Tre', stockAwal: 0, barangMasuk: 0, transferIn: 0, transferOut: 0, spoilWaste: 0, stockAkhir: 0, notes: 'Pecah 1 tre' },
        ];

        const Toast = ({ toast, onClose }) => {
            if (!toast.show) return null;

            return (
                <div className="fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-white transition-all transform duration-300 translate-y-0"
                     style={{ backgroundColor: toast.type === 'success' ? '#059669' : toast.type === 'error' ? '#dc2626' : '#4f46e5' }}>
                    <Icon name={toast.type === 'success' ? 'check-circle' : toast.type === 'error' ? 'alert-circle' : 'info'} className="w-5 h-5" />
                    <span className="text-sm font-medium">{toast.message}</span>
                    <button onClick={onClose} className="ml-2 hover:opacity-80">
                        <Icon name="x" className="w-4 h-4" />
                    </button>
                </div>
            );
        };

        function App() {
            const getTodayDate = () => new Date().toISOString().split('T')[0];

            const [activeTab, setActiveTab] = useState('opname'); // 'opname' | 'suratJalan' | 'riwayat'
            const [selectedDate, setSelectedDate] = useState(getTodayDate());
            const [picName, setPicName] = useState(() => localStorage.getItem('so_pic_name') || 'ilham (checker)');
            const [spvName, setSpvName] = useState(() => localStorage.getItem('so_spv_name') || 'wisnu (SPV)');
            
            // Online status & Firebase sync
            const [isOnline, setIsOnline] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            const [items, setItems] = useState([]);
            const [suratJalanList, setSuratJalanList] = useState([]);
            const [soHistory, setSoHistory] = useState([]);

            const [searchQuery, setSearchQuery] = useState('');
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            
            // Modals
            const [showAddModal, setShowAddModal] = useState(false);
            const [showUploadModal, setShowUploadModal] = useState(false);
            const [previewImage, setPreviewImage] = useState(null);
            const [historyDetail, setHistoryDetail] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);

            // Forms
            const [newItem, setNewItem] = useState({ code: '', name: '', unit: 'Pcs', stockAwal: 0, notes: '' });
            const [newSJ, setNewSJ] = useState({ docNumber: '', supplier: '', notes: '', imageFile: null, imagePreview: null });

            useEffect(() => {
                let unsubItems = null;
                let unsubSJ = null;
                let unsubHistory = null;

                const setupRealtimeSync = async () => {
                    if (!window.firebaseInstance) {
                        await new Promise((resolve) => window.addEventListener('firebase-ready', resolve, { once: true }));
                    }

                    const {
                        auth, db, appId, initialAuthToken,
                        signInAnonymously, signInWithCustomToken,
                        collection, doc, setDoc, onSnapshot
                    } = window.firebaseInstance;

                    if (!db || !auth) {
                        console.warn("Firestore instance unavailable, falling back to local storage state.");
                        setIsOnline(false);
                        loadFromLocalStorage();
                        return;
                    }

                    try {
                        setIsSyncing(true);
                        // Rule 3: Auth First
                        let userCred;
                        if (initialAuthToken) {
                            try {
                                userCred = await signInWithCustomToken(auth, initialAuthToken);
                            } catch (e) {
                                userCred = await signInAnonymously(auth);
                            }
                        } else {
                            userCred = await signInAnonymously(auth);
                        }
                        
                        setCurrentUser(userCred.user);
                        setIsOnline(true);

                        // Rule 1: Public paths for collaborative warehouse team access
                        const itemsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'items');
                        const sjColRef = collection(db, 'artifacts', appId, 'public', 'data', 'suratJalan');
                        const historyColRef = collection(db, 'artifacts', appId, 'public', 'data', 'soHistory');

                        // 1. Items Realtime Listener
                        unsubItems = onSnapshot(itemsColRef, (snapshot) => {
                            const loaded = [];
                            snapshot.forEach(docSnap => {
                                loaded.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            
                            if (loaded.length === 0) {
                                // Seed initial demo items if collection is empty
                                INITIAL_ITEMS.forEach(async (item) => {
                                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', item.id), item);
                                });
                                setItems(INITIAL_ITEMS);
                            } else {
                                setItems(loaded);
                            }
                            setIsSyncing(false);
                        }, (error) => {
                            console.error("Firestore Items Error:", error);
                            setIsSyncing(false);
                        });

                        // 2. Surat Jalan Realtime Listener
                        unsubSJ = onSnapshot(sjColRef, (snapshot) => {
                            const loaded = [];
                            snapshot.forEach(docSnap => {
                                loaded.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            // Sort in JS memory (Rule 2)
                            loaded.sort((a, b) => b.id.localeCompare(a.id));
                            setSuratJalanList(loaded);
                        }, (error) => {
                            console.error("Firestore Surat Jalan Error:", error);
                        });

                        // 3. SO History Realtime Listener
                        unsubHistory = onSnapshot(historyColRef, (snapshot) => {
                            const loaded = [];
                            snapshot.forEach(docSnap => {
                                loaded.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            // Sort in JS memory (Rule 2)
                            loaded.sort((a, b) => b.id.localeCompare(a.id));
                            setSoHistory(loaded);
                        }, (error) => {
                            console.error("Firestore SO History Error:", error);
                        });

                    } catch (err) {
                        console.error("Firebase Sync Error:", err);
                        setIsOnline(false);
                        setIsSyncing(false);
                        loadFromLocalStorage();
                    }
                };

                setupRealtimeSync();

                return () => {
                    if (unsubItems) unsubItems();
                    if (unsubSJ) unsubSJ();
                    if (unsubHistory) unsubHistory();
                };
            }, []);

            const loadFromLocalStorage = () => {
                const savedItems = localStorage.getItem('so_items_data');
                setItems(savedItems ? JSON.parse(savedItems) : INITIAL_ITEMS);

                const savedSJ = localStorage.getItem('so_surat_jalan_data');
                setSuratJalanList(savedSJ ? JSON.parse(savedSJ) : []);

                const savedHist = localStorage.getItem('so_history_data');
                setSoHistory(savedHist ? JSON.parse(savedHist) : []);
            };

            useEffect(() => {
                localStorage.setItem('so_pic_name', picName);
            }, [picName]);

            useEffect(() => {
                localStorage.setItem('so_spv_name', spvName);
            }, [spvName]);

            const showNotification = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => {
                    setToast({ show: false, message: '', type: 'info' });
                }, 3500);
            };

            const calculateUsage = (item) => {
                const awal = Number(item.stockAwal) || 0;
                const masuk = Number(item.barangMasuk) || 0;
                const trIn = Number(item.transferIn) || 0;
                const trOut = Number(item.transferOut) || 0;
                const spoil = Number(item.spoilWaste) || 0;
                const akhir = Number(item.stockAkhir) || 0;

                const totalTersedia = awal + masuk + trIn;
                return totalTersedia - trOut - spoil - akhir;
            };

            // Realtime Sync Helper for Item Changes
            const syncItemToFirestore = async (item) => {
                if (window.firebaseInstance && window.firebaseInstance.db) {
                    const { db, appId, doc, setDoc } = window.firebaseInstance;
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', item.id), item, { merge: true });
                    } catch (err) {
                        console.error("Firestore sync item failed:", err);
                    }
                }
            };

            const handleItemValueChange = (id, field, value) => {
                const numericValue = value === '' ? '' : Math.max(0, Number(value));
                setItems(prev => prev.map(item => {
                    if (item.id === id) {
                        const updated = { ...item, [field]: numericValue };
                        syncItemToFirestore(updated);
                        return updated;
                    }
                    return item;
                }));
            };

            const handleItemTextChange = (id, field, value) => {
                setItems(prev => prev.map(item => {
                    if (item.id === id) {
                        const updated = { ...item, [field]: value };
                        syncItemToFirestore(updated);
                        return updated;
                    }
                    return item;
                }));
            };

            const handleAddNewItem = async (e) => {
                e.preventDefault();
                if (!newItem.name || !newItem.code) {
                    showNotification('Harap isi kode dan nama barang!', 'error');
                    return;
                }

                const created = {
                    id: 'item-' + Date.now(),
                    code: newItem.code,
                    name: newItem.name,
                    unit: newItem.unit || 'Pcs',
                    stockAwal: Number(newItem.stockAwal) || 0,
                    barangMasuk: 0,
                    transferIn: 0,
                    transferOut: 0,
                    spoilWaste: 0,
                    stockAkhir: Number(newItem.stockAwal) || 0,
                    notes: newItem.notes || ''
                };

                setItems(prev => [...prev, created]);
                await syncItemToFirestore(created);

                setShowAddModal(false);
                setNewItem({ code: '', name: '', unit: 'Pcs', stockAwal: 0, notes: '' });
                showNotification('Barang berhasil ditambahkan dan disinkronkan!', 'success');
            };

            const handleDeleteItem = async (itemToDelete) => {
                setItems(prev => prev.filter(i => i.id !== itemToDelete.id));
                if (window.firebaseInstance && window.firebaseInstance.db) {
                    const { db, appId, doc, deleteDoc } = window.firebaseInstance;
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', itemToDelete.id));
                    } catch (err) {
                        console.error("Error deleting item from Firestore:", err);
                    }
                }
                setDeleteConfirm(null);
                showNotification('Barang berhasil dihapus!', 'info');
            };

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (!file.type.includes('image')) {
                        showNotification('Harap unggah file gambar (JPG/PNG)!', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewSJ(prev => ({
                            ...prev,
                            imageFile: file,
                            imagePreview: reader.result
                        }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleUploadSJ = async (e) => {
                e.preventDefault();
                if (!newSJ.docNumber || !newSJ.imagePreview) {
                    showNotification('Nomor Surat Jalan & Foto wajib diisi!', 'error');
                    return;
                }

                const newEntry = {
                    id: 'sj-' + Date.now(),
                    date: selectedDate,
                    docNumber: newSJ.docNumber,
                    supplier: newSJ.supplier || 'Tidak disebutkan',
                    notes: newSJ.notes || '',
                    imageUrl: newSJ.imagePreview,
                    createdAt: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                };

                setSuratJalanList(prev => [newEntry, ...prev]);

                if (window.firebaseInstance && window.firebaseInstance.db) {
                    const { db, appId, doc, setDoc } = window.firebaseInstance;
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'suratJalan', newEntry.id), newEntry);
                    } catch (err) {
                        console.error("Error uploading SJ to Firestore:", err);
                    }
                }

                setShowUploadModal(false);
                setNewSJ({ docNumber: '', supplier: '', notes: '', imageFile: null, imagePreview: null });
                showNotification('Surat jalan berhasil diunggah secara online!', 'success');
            };

            const handleDeleteSJ = async (sjId) => {
                setSuratJalanList(prev => prev.filter(x => x.id !== sjId));
                if (window.firebaseInstance && window.firebaseInstance.db) {
                    const { db, appId, doc, deleteDoc } = window.firebaseInstance;
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'suratJalan', sjId));
                    } catch (err) {
                        console.error("Error deleting SJ from Firestore:", err);
                    }
                }
                showNotification('Dokumen Surat Jalan dihapus!', 'info');
            };

            const handleSaveSoSession = async () => {
                if (items.length === 0) {
                    showNotification('Tidak ada data barang untuk disimpan!', 'error');
                    return;
                }

                const totalSpoil = items.reduce((acc, curr) => acc + (Number(curr.spoilWaste) || 0), 0);
                const totalUsage = items.reduce((acc, curr) => acc + calculateUsage(curr), 0);

                const record = {
                    id: 'SO-' + Date.now(),
                    date: selectedDate,
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                    picName: picName || 'Petugas checker',
                    spvName: spvName || 'Supervisor',
                    totalItems: items.length,
                    totalSpoil,
                    totalUsage,
                    itemsSnapshot: JSON.parse(JSON.stringify(items))
                };

                setSoHistory(prev => [record, ...prev]);

                if (window.firebaseInstance && window.firebaseInstance.db) {
                    const { db, appId, doc, setDoc } = window.firebaseInstance;
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'soHistory', record.id), record);
                    } catch (err) {
                        console.error("Error saving history to Firestore:", err);
                    }
                }

                showNotification(`Hasil Opname (${selectedDate}) tersimpan ke Riwayat Online!`, 'success');
            };

            const generatePDF = (customItems = null, dateTitle = selectedDate, customPic = picName, customSpv = spvName) => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('landscape');
                    const targetItems = customItems || items;

                    doc.setFontSize(18);
                    doc.setTextColor(30, 41, 59);
                    doc.text('LAPORAN STOCK OPNAME ALDIS HOTDOG BLOK M', 14, 18);

                    doc.setFontSize(10);
                    doc.setTextColor(100, 116, 139);
                    doc.text(`Tanggal Opname: ${dateTitle}`, 14, 25);
                    doc.text(`PIC (Petugas): ${customPic || '-'}  |  SPV (Supervisor): ${customSpv || '-'}`, 14, 30);
                    doc.text(`Waktu Cetak: ${new Date().toLocaleString('id-ID')} (Online Sync Active)`, 14, 35);

                    const tableColumn = [
                        "No", "Kode", "Nama Barang", "Satuan", 
                        "Stk Awal", "Masuk", "Trf In", "Trf Out", 
                        "Spoil/Waste", "Stk Akhir", "Usage", "Catatan"
                    ];

                    const tableRows = targetItems.map((item, index) => [
                        index + 1,
                        item.code,
                        item.name,
                        item.unit,
                        item.stockAwal,
                        item.barangMasuk,
                        item.transferIn,
                        item.transferOut,
                        item.spoilWaste,
                        item.stockAkhir,
                        calculateUsage(item),
                        item.notes || '-'
                    ]);

                    doc.autoTable({
                        head: [tableColumn],
                        body: tableRows,
                        startY: 40,
                        theme: 'grid',
                        headStyles: {
                            fillColor: [79, 70, 229],
                            textColor: [255, 255, 255],
                            fontStyle: 'bold',
                            halign: 'center'
                        },
                        bodyStyles: {
                            fontSize: 8,
                            textColor: [51, 65, 85]
                        },
                        columnStyles: {
                            0: { halign: 'center', cellWidth: 10 },
                            1: { halign: 'center', cellWidth: 20 },
                            2: { cellWidth: 40 },
                            3: { halign: 'center', cellWidth: 16 },
                            4: { halign: 'right', cellWidth: 18 },
                            5: { halign: 'right', cellWidth: 18 },
                            6: { halign: 'right', cellWidth: 18 },
                            7: { halign: 'right', cellWidth: 18 },
                            8: { halign: 'right', cellWidth: 22 },
                            9: { halign: 'right', cellWidth: 20 },
                            10: { halign: 'right', cellWidth: 18 },
                            11: { cellWidth: 'auto' }
                        }
                    });

                    const finalY = doc.lastAutoTable.finalY + 20;
                    if (finalY < 180) {
                        doc.setFontSize(9);
                        doc.setTextColor(51, 65, 85);
                        
                        doc.text("Dibuat Oleh (PIC),", 30, finalY);
                        doc.text(`( ${customPic || 'Petugas Stock Opname'} )`, 20, finalY + 25);

                        doc.text("Diverifikasi Oleh (SPV),", 130, finalY);
                        doc.text(`( ${customSpv || 'Supervisor'} )`, 122, finalY + 25);
                    }

                    doc.save(`Stock_Opname_${dateTitle}.pdf`);
                    showNotification('Laporan PDF berhasil diunduh!', 'success');
                } catch (err) {
                    console.error("PDF Generation Error: ", err);
                    showNotification('Gagal membuat PDF.', 'error');
                }
            };

            const filteredItems = useMemo(() => {
                return items.filter(item => 
                    item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.code.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [items, searchQuery]);

            const filteredSuratJalan = useMemo(() => {
                return suratJalanList.filter(sj => sj.date === selectedDate);
            }, [suratJalanList, selectedDate]);

            const filteredHistory = useMemo(() => {
                return soHistory.filter(h => h.date === selectedDate || !selectedDate);

                                                        </span>
                                                    </div>
                                                    <p className="text-xs text-slate-500">
                                                        Tanggal: <span className="font-semibold text-slate-700">{rec.date}</span> | Jam: {rec.timestamp}
                                                    </p>
                                                    <div className="flex items-center gap-3 text-xs text-indigo-700 font-medium pt-0.5">
                                                        <span>PIC: <strong>{rec.picName || '-'}</strong></span>
                                                        <span>•</span>
                                                        <span>SPV: <strong>{rec.spvName || '-'}</strong></span>
                                                    </div>
                                                    <div className="flex items-center gap-4 text-xs text-slate-600 pt-1">
                                                        <span><strong>{rec.totalItems}</strong> Jenis Barang</span>
                                                        <span>•</span>
                                                        <span>Spoil: <strong className="text-rose-600">{rec.totalSpoil}</strong></span>
                                                        <span>•</span>
                                                        <span>Usage: <strong className="text-blue-600">{rec.totalUsage}</strong></span>
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-2 w-full md:w-auto justify-end">
                                                    <button 
                                                        onClick={() => setHistoryDetail(rec)}
                                                        className="px-3 py-1.5 border border-slate-200 hover:bg-slate-50 rounded-lg text-xs font-medium text-slate-700 transition flex items-center gap-1"
                                                    >
                                                        <Icon name="eye" className="w-3.5 h-3.5" />
                                                        <span>Detail</span>
                                                    </button>

                                                    <button 
                                                        onClick={() => generatePDF(rec.itemsSnapshot, rec.date, rec.picName, rec.spvName)}
                                                        className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-medium transition flex items-center gap-1"
                                                    >
                                                        <Icon name="file-text" className="w-3.5 h-3.5" />
                                                        <span>Cetak PDF</span>
                                                    </button>

                                                    <button 
                                                        onClick={() => {
                                                            setItems(rec.itemsSnapshot);
                                                            if (rec.picName) setPicName(rec.picName);
                                                            if (rec.spvName) setSpvName(rec.spvName);
                                                            setActiveTab('opname');
                                                            showNotification('Data riwayat dimuat ke tabel aktif!', 'info');
                                                        }}
                                                        className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium transition flex items-center gap-1"
                                                    >
                                                        <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
                                                        <span>Muat Data</span>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODALS */}
                    {/* MODAL: Tambah Barang */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                    <h3 className="font-bold text-slate-800 text-sm">Tambah Barang Baru</h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <form onSubmit={handleAddNewItem} className="p-5 space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Kode Barang *</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="contoh: BRG-006" 
                                            value={newItem.code} 
                                            onChange={e => setNewItem({ ...newItem, code: e.target.value })}
                                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Nama Barang *</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="contoh: Gula Merah Premium" 
                                            value={newItem.name} 
                                            onChange={e => setNewItem({ ...newItem, name: e.target.value })}
                                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Satuan</label>
                                            <input 
                                                type="text" 
                                                placeholder="Pcs, Kg, Sak, Box..." 
                                                value={newItem.unit} 
                                                onChange={e => setNewItem({ ...newItem, unit: e.target.value })}
                                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Stock Awal</label>
                                            <input 
                                                type="number" 
                                                min="0" 
                                                value={newItem.stockAwal} 
                                                onChange={e => setNewItem({ ...newItem, stockAwal: e.target.value })}
                                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Catatan</label>
                                        <input 
                                            type="text" 
                                            placeholder="Opsional..." 
                                            value={newItem.notes} 
                                            onChange={e => setNewItem({ ...newItem, notes: e.target.value })}
                                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div className="pt-3 flex items-center justify-end gap-2 border-t border-slate-100">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowAddModal(false)}
                                            className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm"
                                        >
                                            Simpan Barang
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Upload Surat Jalan */}
                    {showUploadModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                    <h3 className="font-bold text-slate-800 text-sm">Upload Surat Jalan ({selectedDate})</h3>
                                    <button onClick={() => setShowUploadModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <form onSubmit={handleUploadSJ} className="p-5 space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Nomor Surat Jalan / Dokumen *</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="SJ-2026/09/XXX" 
                                            value={newSJ.docNumber} 
                                            onChange={e => setNewSJ({ ...newSJ, docNumber: e.target.value })}
                                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Supplier / Vendor</label>
                                        <input 
                                            type="text" 
                                            placeholder="PT. Sinar Jaya..." 
                                            value={newSJ.supplier} 
                                            onChange={e => setNewSJ({ ...newSJ, supplier: e.target.value })}
                                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Foto Surat Jalan (JPG/PNG) *</label>
                                        <input 
                                            type="file" 
                                            accept="image/*"
                                            onChange={handleImageChange}
                                            className="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
                                        />
                                    </div>

                                    {newSJ.imagePreview && (
                                        <div className="mt-2 rounded-lg border border-slate-200 overflow-hidden h-36 bg-slate-50 flex items-center justify-center">
                                            <img src={newSJ.imagePreview} alt="Preview" className="max-h-full max-w-full object-contain" />
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Catatan / Ringkasan Barang</label>
                                        <textarea 
                                            rows="2"
                                            placeholder="Ringkasan item pada surat jalan..." 
                                            value={newSJ.notes} 
                                            onChange={e => setNewSJ({ ...newSJ, notes: e.target.value })}
                                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        ></textarea>
                                    </div>

                                    <div className="pt-3 flex items-center justify-end gap-2 border-t border-slate-100">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowUploadModal(false)}
                                            className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm"
                                        >
                                            Unggah Surat Jalan
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Full Preview Image */}
                    {previewImage && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="relative max-w-4xl w-full bg-slate-900 rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-4 bg-slate-800 text-white flex items-center justify-between">
                                    <div>
                                        <h3 className="font-bold text-sm">{previewImage.docNumber}</h3>
                                        <p className="text-xs text-slate-300">{previewImage.supplier} • {previewImage.date}</p>
                                    </div>
                                    <button onClick={() => setPreviewImage(null)} className="p-1 hover:bg-slate-700 rounded-lg">
                                        <Icon name="x" className="w-6 h-6" />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-auto p-4 flex items-center justify-center bg-black/50">
                                    <img src={previewImage.imageUrl} alt={previewImage.docNumber} className="max-w-full max-h-[70vh] object-contain rounded-lg" />
                                </div>
                                {previewImage.notes && (
                                    <div className="p-4 bg-slate-800 text-slate-300 text-xs border-t border-slate-700">
                                        <strong>Catatan:</strong> {previewImage.notes}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: Detail History */}
                    {historyDetail && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                    <div>
                                        <h3 className="font-bold text-slate-800">Detail Stock Opname #{historyDetail.id}</h3>
                                        <p className="text-xs text-slate-500">Tanggal: {historyDetail.date} | Jam: {historyDetail.timestamp}</p>
                                        <p className="text-xs text-indigo-600 font-medium mt-0.5">PIC: {historyDetail.picName || '-'} | SPV: {historyDetail.spvName || '-'}</p>
                                    </div>
                                    <button onClick={() => setHistoryDetail(null)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-5 overflow-y-auto space-y-4">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-100 text-slate-600 font-semibold border-b">
                                            <tr>
                                                <th className="p-2">Kode</th>
                                                <th className="p-2">Nama</th>
                                                <th className="p-2 text-center">Satuan</th>
                                                <th className="p-2 text-center">Awal</th>
                                                <th className="p-2 text-center">Masuk</th>
                                                <th className="p-2 text-center text-rose-600">Spoil</th>
                                                <th className="p-2 text-center text-emerald-700 font-bold">Akhir</th>
                                                <th className="p-2 text-center text-blue-600">Usage</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {historyDetail.itemsSnapshot.map(item => (
                                                <tr key={item.id}>
                                                    <td className="p-2 font-mono text-slate-500">{item.code}</td>
                                                    <td className="p-2 font-medium text-slate-800">{item.name}</td>
                                                    <td className="p-2 text-center font-semibold text-slate-600">{item.unit || 'Pcs'}</td>
                                                    <td className="p-2 text-center">{item.stockAwal}</td>
                                                    <td className="p-2 text-center">{item.barangMasuk}</td>
                                                    <td className="p-2 text-center text-rose-600">{item.spoilWaste}</td>
                                                    <td className="p-2 text-center font-bold text-emerald-700">{item.stockAkhir}</td>
                                                    <td className="p-2 text-center font-bold text-blue-600">{calculateUsage(item)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end">
                                    <button 
                                        onClick={() => setHistoryDetail(null)} 
                                        className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-semibold"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Delete Confirm Dialog */}
                    {deleteConfirm && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-5 text-center">
                                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <Icon name="alert-triangle" className="w-6 h-6" />
                                </div>
                                <h3 className="font-bold text-slate-800 text-base">Hapus Barang Ini?</h3>
                                <p className="text-xs text-slate-500 mt-1">
                                    Apakah Anda yakin ingin menghapus <strong>"{deleteConfirm.name}"</strong> dari tabel opname?
                                </p>
                                <div className="mt-5 flex items-center justify-center gap-2">
                                    <button 
                                        onClick={() => setDeleteConfirm(null)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => handleDeleteItem(deleteConfirm)}
                                        className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-medium rounded-lg"
                                    >
                                        Ya, Hapus
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Notification Toast */}
                    <Toast toast={toast} onClose={() => setToast({ ...toast, show: false })} />
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
